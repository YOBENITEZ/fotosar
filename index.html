<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Fotos con IA</title>
    <!-- Cargamos face-api.js desde un CDN confiable -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 600px;
        }

        h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            margin: 0 0 15px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            background-color: #f3f4f6;
            color: #374151;
            margin-bottom: 20px;
        }

        .status-badge.loading {
            background-color: #fef3c7;
            color: #92400e;
        }

        .status-badge.ready {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-badge.error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .upload-container {
            margin-bottom: 30px;
        }

        /* Estilo nativo e infalible para el botón de input de archivos */
        input[type="file"] {
            font-size: 1rem;
            padding: 10px;
            background: var(--card-bg);
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }

        input[type="file"]:hover {
            border-color: var(--primary);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .img-container {
            width: 100%;
            padding-top: 100px; /* Relación de aspecto 1:1 por defecto */
            position: relative;
            background: #e5e7eb;
        }

        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            padding: 12px;
            font-size: 0.9rem;
            border-top: 1px solid #f3f4f6;
            background: #fafafa;
        }

        .info .faces-count {
            font-weight: 600;
            color: var(--primary);
        }

        .info .face-size {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Organizador de Fotos con IA</h1>
        <p>Sube tus imágenes en formato <strong>.jpg</strong> o <strong>.jpeg</strong>. El sistema las analizará y las ordenará automáticamente por cantidad de personas y tamaño del rostro en primer plano.</p>
        <div id="status" class="status-badge loading">Cargando modelos de Inteligencia Artificial...</div>
    </header>

    <div class="upload-container">
        <!-- Input nativo directo para asegurar compatibilidad absoluta con clics -->
        <input type="file" id="file-input" accept=".jpg, .jpeg" multiple>
    </div>

    <main class="gallery" id="gallery"></main>

    <script>
        const fileInput = document.getElementById('file-input');
        const gallery = document.getElementById('gallery');
        const statusBadge = document.getElementById('status');
        
        let loadedImagesData = [];
        let isAiReady = false;

        // URL absoluta de los modelos públicos de face-api para evitar bloqueos CORS locales si es posible
        const MODEL_URL = 'https://raw.githubusercontent.com/vladmandic/face-api/master/model/';

        // Cargar modelos de Inteligencia Artificial al iniciar de forma asíncrona
        async function initAI() {
            try {
                // Usamos el detector TinyFace que es super ligero y rápido
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                isAiReady = true;
                statusBadge.textContent = "✓ IA Lista para ordenar";
                statusBadge.className = "status-badge ready";
            } catch (error) {
                console.error("Error cargando modelos de IA:", error);
                statusBadge.textContent = "⚠ IA Desactivada (Modo seguro: Usa Live Server o Netlify)";
                statusBadge.className = "status-badge error";
            }
        }

        // Ejecutar carga de IA al cargar la ventana
        window.addEventListener('DOMContentLoaded', initAI);

        // Escuchar el evento de selección de archivos nativo
        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect(event) {
            const files = event.target.files;
            if (!files.length) return;

            // Limpiar datos anteriores para una nueva carga limpia
            loadedImagesData = [];
            gallery.innerHTML = '';

            // Procesar cada archivo seleccionado uno por uno
            Array.from(files).forEach((file, index) => {
                if (!file.type.match('image/jpeg') && !file.name.toLowerCase().endsWith('.jpg') && !file.name.toLowerCase().endsWith('.jpeg')) {
                    alert(`El archivo "${file.name}" no es un formato .jpg válido.`);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgUrl = e.target.result;
                    
                    // Crear un objeto de datos base para la imagen cargada
                    const imgData = {
                        id: index,
                        name: file.name,
                        url: imgUrl,
                        facesCount: 0,
                        maxFaceSize: 0,
                        processed: false
                    };

                    loadedImagesData.push(imgData);
                    
                    // Renderizar inmediatamente la imagen en la galería sin esperar a la IA
                    renderGallery();

                    // Procesar el análisis de rostros en segundo plano si la IA cargó con éxito
                    if (isAiReady) {
                        analyzeImageFace(imgData);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // Función para renderizar y actualizar la vista de la galería de manera ordenada
        function renderGallery() {
            gallery.innerHTML = '';

            // Aplicar lógica de ordenamiento si ya han sido procesadas
            const sortedData = [...loadedImagesData].sort((a, b) => {
                // 1. Prioridad: cantidad de rostros de menor a mayor
                if (a.facesCount !== b.facesCount) {
                    return a.facesCount - b.facesCount;
                }
                // 2. Desempate: tamaño del rostro principal de mayor a menor (primeros planos al inicio)
                return b.maxFaceSize - a.maxFaceSize;
            });

            sortedData.forEach(data => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = data.id;

                let infoText = data.processed 
                    ? `<span class="faces-count">Rostros: ${data.facesCount}</span>
                       <div class="face-size">Rostro principal: ${Math.round(data.maxFaceSize)}px</div>`
                    : `<span class="faces-count" style="color: #d97706;">Analizando con IA...</span>`;

                if (!isAiReady && !data.processed) {
                    infoText = `<span class="faces-count" style="color: #6b7280;">Imagen cargada</span>`;
                }

                card.innerHTML = `
                    <div class="img-container">
                        <img src="${data.url}" alt="${data.name}">
                    </div>
                    <div class="info">
                        ${infoText}
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // Analizar rostros usando la librería face-api
        async function analyzeImageFace(imgData) {
            try {
                // Crear un elemento de imagen fantasma en memoria para que la IA lo lea
                const htmlImg = new Image();
                htmlImg.src = imgData.url;
                
                htmlImg.onload = async () => {
                    // Detectar todos los rostros en la foto utilizando TinyFaceDetector
                    const detections = await faceapi.detectAllFaces(htmlImg, new faceapi.TinyFaceDetectorOptions());
                    
                    imgData.facesCount = detections.length;
                    
                    // Calcular el tamaño del rostro más grande detectado (área del cuadro contenedor)
                    if (detections.length > 0) {
                        let maxSize = 0;
                        detections.forEach(det => {
                            const size = det.box.width * det.box.height;
                            if (size > maxSize) {
                                maxSize = Math.sqrt(size); // Usamos la raíz cuadrada para tener una dimensión lineal en px
                            }
                        });
                        imgData.maxFaceSize = maxSize;
                    } else {
                        imgData.maxFaceSize = 0;
                    }

                    imgData.processed = true;
                    
                    // Volver a renderizar la galería con las nuevas métricas calculadas
                    renderGallery();
                };
            } catch (err) {
                console.error("Error analizando la imagen individual: ", err);
                imgData.processed = true;
                renderGallery();
            }
        }
    </script>
</body>
</html>
